[project]
name = "project-3"
version = "0.1.0"
description = "Prédiction de la consommation énergétique des bâtiments de Seattle"
authors = [
    {name = "rafadmgs",email = "rafa.domingos.silva@gmail.com"}
]
requires-python = "^3.12"
dependencies = [
    "pandas (>=3.0.3,<4.0.0)",
    "numpy (>=2.5.0,<3.0.0)",
    "matplotlib (>=3.11.0,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scikit-learn (>=1.9.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "notebook (>=7.6.0,<8.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)"
]
